[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
argon2 = { version = "0.5.3", features = ["std"] }
aws-config = "1.8.0"
aws-sdk-s3 = "1.94.0"
axum = { version = "0.8.4", features = ["http2", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
ciborium = "0.2.2"
cookie = { version = "0.18.1", features = ["percent-encode", "secure"] }
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.1.1", features = ["pkcs8", "rand_core"] }
futures-core = "0.3.31"
itertools = "0.14.0"
mimalloc = "0.1.46"
mime = "0.3.17"
rand = "0.9.1"
rand_core = "0.6.4"
redis = { version = "0.32.0", features = ["tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.17"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "derive",
    "chrono",
] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
totp-rs = { version = "5.7.0", features = ["otpauth"] }
tower-http = { version = "0.6.5", features = [
    "trace",
    "timeout",
    "request-id",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ulid = { version = "1.2.1", features = ["serde"] }

[dev-dependencies]
insta = "1.43.1"
serde_json = "1.0.140"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
